name: AI Automatic Bug Fixer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze_and_patch:
    if: contains(github.event.issue.labels.*.name, 'ai-review-requested')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI Dependencies
        run: |
          pip install google-genai

      - name: Run Gemini Engine Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/ai_agent.py

      - name: Open Automatic AI Resolution PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ai: patch generated for issue #${{ github.event.issue.number }}"
          title: "🤖 AI Fix: Applied Patch for Issue #${{ github.event.issue.number }}"
          body: |
            This Pull Request was dynamically generated by the Gemini engine in response to the user's issue report.
            Please review the modified files carefully before merging.
          branch: "ai/fix-issue-${{ github.event.issue.number }}"
          base: main
